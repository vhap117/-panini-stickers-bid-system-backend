name: panini-bid-dev

services:
  app:
    build: .
    command: npm run dev
    volumes:
      - ./:/app
      # anonymous volume so the source mount does not shadow image-installed deps
      - /app/node_modules
      # Uploaded Photos live outside the source mount (ADR-0006): the local
      # storage impl writes here and the named volume keeps them across
      # rebuilds instead of leaving them in the working tree.
      - panini_uploads:/app/var/uploads
    environment:
      PORT: "3000"
      JWT_SECRET: dev-insecure-jwt-secret
      # Photo storage selection (ADR-0006). The local driver writes into the
      # volume mounted above.
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /app/var/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:8100,http://localhost:8101,http://localhost:8102,http://localhost,https://localhost,capacitor://localhost
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: panini_bid
      PGUSER: panini
      PGPASSWORD: panini
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'fetch(\"http://127.0.0.1:3000/health\").then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: panini_bid
      POSTGRES_USER: panini
      POSTGRES_PASSWORD: panini
    ports:
      - "5433:5432"
    volumes:
      - panini_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panini -d panini_bid"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  panini_dev_pgdata:
  panini_uploads:
